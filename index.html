<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1A8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="견적 포켓">
<title>견적 포켓</title>
<style>
/* 배치: 한 줄 세로 흐름. 위에는 눈금자 머리, 가운데는 스크롤되는 작업면, 아래에는 합계와 탭. PDF 견적서(A안)와 같은 남색·눈금·가는 숫자 */
:root{
  --ink:#0B1A8C; --on-ink:#FFFFFF; --text:#1B1D22; --sub:#5E636E; --faint:#9AA0AB; --line:#D5D8DE; --hair:#ECEEF2;
  --bg:#F3F4F7; --card:#FFFFFF;
  --warn:#8A5200; --warn-bg:#FFF1D6; --crit:#B3261E; --crit-bg:#FDE8E6; --note:#2B3A9E; --note-bg:#E8EBFB;
  --f-num:'PLight','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-title:'PThin','PLight',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#A3AEFF; --on-ink:#0B1030; --text:#E9EBF0; --sub:#A6ACB8; --faint:#737A88; --line:#2C313C; --hair:#20242D;
  --bg:#0E1015; --card:#171A21;
  --warn:#F2B960; --warn-bg:#35270B; --crit:#FF9086; --crit-bg:#3A1613; --note:#B4BDFF; --note-bg:#1C2148;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#A3AEFF; --on-ink:#0B1030; --text:#E9EBF0; --sub:#A6ACB8; --faint:#737A88; --line:#2C313C; --hair:#20242D;
  --bg:#0E1015; --card:#171A21;
  --warn:#F2B960; --warn-bg:#35270B; --crit:#FF9086; --crit-bg:#3A1613; --note:#B4BDFF; --note-bg:#1C2148;
  color-scheme:dark;
}
@font-face{font-family:'PLight';src:url('fonts/P-Light.ttf') format('truetype');font-display:swap}
@font-face{font-family:'PThin';src:url('fonts/P-Thin.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
header{padding-top:env(safe-area-inset-top);flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:8px}
.head h1{font-family:var(--f-title);font-weight:100;font-size:34px;letter-spacing:.16em;line-height:1;margin:0;color:var(--text)}
.head small{font-size:11px;color:var(--faint);text-align:right;letter-spacing:.02em}
.ruler{height:9px;background:
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 40px) 0 0/100% 9px no-repeat,
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 20px) 0 0/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 4px) 0 0/100% 3px no-repeat}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{display:flex;flex-direction:column;gap:12px;padding-top:14px;padding-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--faint);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:15px;flex:1 1 140px;text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.quiet{border-color:var(--line);color:var(--text);font-weight:500}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--sub);text-decoration:underline;font-size:13px;align-self:flex-start}
.meta{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.meta dt{color:var(--faint)} .meta dd{margin:0;color:var(--sub);overflow-wrap:anywhere}
.src{margin:10px 0 0;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:3px solid var(--line)}
.line.need{border-left-color:var(--warn)} .line.crit{border-left-color:var(--crit)} .line.ok{border-left-color:var(--ink)}
.line .no{font-size:11px;color:var(--faint);letter-spacing:.06em;padding-top:3px;font-variant-numeric:tabular-nums}
.line .lbl{min-width:0;overflow-wrap:anywhere}
.line .lbl b{font-weight:600} .line .lbl span{color:var(--sub)}
.line .amt{font-family:var(--f-num);font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.line .amt.none{font-family:var(--f-body);font-size:13px;color:var(--warn);font-weight:600;padding-top:3px}
.line .calc{grid-column:2/4;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.chips{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;line-height:1.3;padding:3px 8px;border-radius:999px;background:var(--hair);color:var(--sub)}
.chip.crit{background:var(--crit-bg);color:var(--crit);font-weight:600}
.chip.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.note{background:var(--note-bg);color:var(--note)}
.notice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notice li{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/3}
.field label,.field .lab{font-size:12px;color:var(--sub)}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;width:100%;font-size:16px}
.field .hint{font-size:12px;color:var(--faint)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);min-height:32px}
.checks input{width:20px;height:20px;min-height:0;accent-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--bg);color:var(--sub);border-left:1px solid var(--line);font-size:14px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}
footer{padding-bottom:env(safe-area-inset-bottom);flex:none;background:var(--card);border-top:1px solid var(--line)}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end;padding-top:10px;padding-bottom:10px}
.sum .k{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:600}
.sum .v{font-family:var(--f-num);font-size:30px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .s{font-size:12px;color:var(--sub);grid-column:1/2}
.sum .acts{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:6px}
.sum .acts .btn{flex:none;min-height:40px;padding:0 14px;font-size:14px}
nav{display:flex;border-top:1px solid var(--hair)}
nav button{flex:1;min-height:48px;border:0;background:none;color:var(--faint);font-size:13px;font-weight:600;letter-spacing:.06em;border-top:2px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.grp h2{font-size:14px;margin:0 0 6px;font-weight:600}
.grp .sub{font-size:12px;color:var(--faint);margin:0 0 8px}
.pt{width:100%;border-collapse:collapse;font-size:14px}
.pt td{padding:8px 0;border-top:1px solid var(--hair);vertical-align:baseline}
.pt td.p{padding-left:10px;text-align:right;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt td.h{text-align:right;color:var(--faint);font-size:12px;padding-left:10px;font-variant-numeric:tabular-nums}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.rec .t{font-weight:600;overflow-wrap:anywhere} .rec .d{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.rec .a{font-family:var(--f-num);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rec .row{grid-column:1/3;margin-top:8px}
.rec .row .btn{min-height:40px;font-size:14px}
.empty{color:var(--sub);font-size:14px;margin:0}
.state{padding:28px 0;text-align:center;color:var(--sub);font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(10,12,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:16px;margin:0}
.preview{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.preview .big{font-family:var(--f-num);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.preview .ref{font-size:12px;color:var(--sub)}
.site .addr{font-size:17px;font-weight:600;overflow-wrap:anywhere;margin:0}
.site .srcline{font-size:12px;color:var(--faint);margin:2px 0 10px;overflow-wrap:anywhere}
a.btn{text-decoration:none}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cands button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sub);text-align:left}
.cands button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.mat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--hair)}
.mat:first-of-type{border-top:0}
.mat .n{font-weight:600;overflow-wrap:anywhere;font-size:14px}
.mat .st{font-size:12px;color:var(--sub);grid-column:1/3;overflow-wrap:anywhere}
.mat .sm{font-size:13px;color:var(--text);grid-column:1/3;overflow-wrap:anywhere;margin-top:4px}
.mat .x{background:none;border:0;color:var(--faint);font-size:13px;text-decoration:underline;padding:0 0 0 8px;min-height:28px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--note-bg);color:var(--note);margin-right:6px;vertical-align:1px}
.badge.none{background:var(--warn-bg);color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(72px,30%) 1fr;gap:2px 12px;padding:9px 0;border-top:1px solid var(--hair)}
.kv:first-of-type{border-top:0}
.kv .k{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.kv .v{font-size:14px;overflow-wrap:anywhere}
.kv .s{grid-column:2;font-size:11px;color:var(--faint);overflow-wrap:anywhere}
.lead{font-size:15px;margin:0;overflow-wrap:anywhere}
.blist{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prog{font-size:13px;color:var(--sub);margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:86%;z-index:20;text-align:center}
@media (max-width:360px){.form{grid-template-columns:1fr}.field.full{grid-column:1}.sum .v{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header><div class="wrap head"><h1>견적서</h1><small id="ver">단가표 불러오는 중</small></div><div class="ruler" aria-hidden="true"></div></header>
<main id="main"><div class="wrap" id="view"><p class="state">단가표를 불러오고 있어요.</p></div></main>
<footer><div class="wrap sum" id="sum" hidden></div><nav class="wrap" aria-label="화면 선택">
<button type="button" data-tab="write" aria-current="page">작성</button><button type="button" data-tab="mats">자료</button><button type="button" data-tab="recs">기록</button><button type="button" data-tab="table">단가표</button></nav></footer>
<div id="layer"></div>
<script>
/* 별도 앱용: 암호로 잠긴 자료 풀기, 이 폰의 기록 저장, 파일 저장 */
(function(){
'use strict';
var KEY='qp-key',ENC='data.enc',RECS='qp-quotes';
function b64d(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function getPack(){return fetch(ENC,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('data');return r.json();});}
async function derive(pass,pack){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(pack.salt),iterations:pack.iter,hash:'SHA-256'},km,256));
}
async function decrypt(raw,pack){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pack.iv)},key,b64d(pack.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function getKey(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
window.__standalone=true;
window.__storeNote='기록은 이 폰에만 저장돼요. 동료와 함께 보는 기능은 준비 중이에요.';
window.__loadData=async function(){
  var pack=await getPack(),k=getKey();
  if(!k)throw {code:'locked'};
  try{return await decrypt(b64d(k),pack);}catch(e){try{localStorage.removeItem(KEY);}catch(x){}throw {code:'locked',bad:true};}
};
window.__unlock=async function(pass){
  var pack=await getPack(),norm=String(pass).toUpperCase().replace(/[^A-Z0-9]/g,''),raw=await derive(norm,pack);
  await decrypt(raw,pack);localStorage.setItem(KEY,b64e(raw));
};
window.__lock=function(){try{localStorage.removeItem(KEY);}catch(e){}};

/* 기록: 이 폰의 저장소 */
var subs=[];
function readAll(){try{return JSON.parse(localStorage.getItem(RECS)||'{}')||{};}catch(e){return {};}}
function writeAll(o){localStorage.setItem(RECS,JSON.stringify(o));}
function snap(){var o=readAll();return {docs:Object.keys(o).map(function(id){return {id:id,exists:true,data:function(){return o[id];}};}).sort(function(a,b){return (b.data().savedAt||0)-(a.data().savedAt||0);})};}
function notify(){var s=snap();subs.forEach(function(cb){try{cb(s);}catch(e){}});}
function docRef(path){var id=path.split('/').pop();return {id:id,path:path,
  get:async function(){var o=readAll();return {id:id,exists:id in o,data:function(){return o[id];}};},
  set:async function(b){var o=readAll();o[id]=JSON.parse(JSON.stringify(b));try{writeAll(o);}catch(e){throw {code:'quota_exceeded',message:'저장 공간이 가득 찼어요'};}notify();},
  delete:async function(){var o=readAll();delete o[id];writeAll(o);notify();}};}
var db={doc:docRef,collection:function(p){var q={doc:function(id){return docRef(p+'/'+(id||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8))));},orderBy:function(){return q;},limit:function(){return q;},onSnapshot:function(cb){subs.push(cb);setTimeout(function(){cb(snap());},0);return function(){};}};return q;}};
window.addEventListener('storage',function(e){if(e.key===RECS)notify();});

/* 파일 저장: 손가락으로 누른 순간에만 공유 창을 열 수 있어서, 준비된 뒤 단추를 한 번 더 누르게 한다 */
var dl={save:function(o){return new Promise(function(res,rej){
  var blob=o.data instanceof Blob?o.data:new Blob([o.data]),file=null,canShare=false;
  try{file=new File([blob],o.filename,{type:'application/pdf'});canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
  var url=URL.createObjectURL(blob),L=document.getElementById('layer'),done=false;
  function close(ok){if(done)return;done=true;L.innerHTML='';setTimeout(function(){URL.revokeObjectURL(url);},60000);ok?res({status:'saved'}):rej({code:'declined',message:'closed'});}
  L.innerHTML='<div class="sheetbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="파일 저장"><h2>PDF가 준비됐어요</h2><p style="margin:0;font-size:13px;overflow-wrap:anywhere"></p><div class="row">'+(canShare?'<button type="button" class="btn primary" id="dl-share">보내기 · 저장</button>':'')+'<a class="btn'+(canShare?' quiet':' primary')+'" id="dl-get" download>이 폰에 받기</a><button type="button" class="btn quiet" id="dl-close">닫기</button></div></div></div>';
  L.querySelector('p').textContent=o.filename;var a=L.querySelector('#dl-get');a.href=url;a.setAttribute('download',o.filename);
  a.addEventListener('click',function(){setTimeout(function(){close(true);},400);});
  var sh=L.querySelector('#dl-share');if(sh)sh.addEventListener('click',function(){navigator.share({files:[file],title:o.filename}).then(function(){close(true);}).catch(function(e){if(e&&e.name==='AbortError')return;a.click();});});
  L.querySelector('#dl-close').addEventListener('click',function(){close(false);});
});}};
window.claude={use:function(n){return Promise.resolve(n==='db'?db:n==='downloads'?dl:null);}};
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();

/* 견적 계산 엔진 (PC용 make_quote.py v0.3과 같은 규칙) */
(function (root) {
  'use strict';
  function ns(s) { return String(s == null ? '' : s).replace(/\s+/g, ''); }
  function has(t, k) { return t.indexOf(k) >= 0; }
  function methods(text) {
    var t = ns(text).toUpperCase(), m = [];
    if (has(t, '할암')) m.push('할암');
    if (has(t, '무진동')) m.push(has(t, '극협소') ? '무진동(극협소)' : '무진동');
    if (has(t, '미진동')) m.push('미진동');
    if (has(t, '정밀')) m.push('정밀진동제어');
    if (has(t, '중,소규모') || has(t, '중·소규모')) { m.push('진동제어(중규모)'); m.push('진동제어(소규모)'); }
    else {
      if ((has(t, '소규모') && !has(t, 'PIT') && !has(t, '독립기초')) || has(t, '(소)')) m.push('진동제어(소규모)');
      if (has(t, '중규모') || has(t, '(중)')) m.push('진동제어(중규모)');
    }
    if (has(t, '대규모')) m.push('대규모');
    if (has(t, '일반발파')) m.push('일반');
    if (has(t, 'BREAKER') || has(t, '브레이커') || has(t, '브레카')) m.push('브레이커');
    if (has(t, '독립기초') || has(t, 'PIT')) m.push('소규모 터파기(독립기초·Pit)');
    if (has(t, '기계터파기')) m.push('기계터파기');
    return m;
  }

function mergeSums(L){if(L.length===1)return L[0];var o={kind:'',summary:'',address:'',address_where:'',facts:[],cautions:[]};L.forEach(function(x){if(!o.kind)o.kind=x.kind;if(x.summary)o.summary+=(o.summary?' ':'')+x.summary;if(!o.address&&x.address){o.address=x.address;o.address_where=x.address_where;}o.facts=o.facts.concat(x.facts);x.cautions.forEach(function(c){if(o.cautions.indexOf(c)<0)o.cautions.push(c);});});o.summary=o.summary.slice(0,900);o.facts=o.facts.slice(0,36);o.cautions=o.cautions.slice(0,10);return o;}

function sampleMsg(e){var c=e&&e.code;return c==='cancelled'?'요약을 멈췄어요.':c==='not_granted'?'Claude 사용을 허용하지 않아 요약하지 못했어요.':c==='rate_limited'?(e.reason==='usage_limit'?'사용량 한도에 닿았어요. 나중에 다시 해 주세요.':'요청이 몰렸어요. 잠시 뒤에 다시 눌러 주세요.'):c==='session_expired'?'로그인이 풀렸어요. 다시 로그인해 주세요.':c==='refused'?'Claude가 이 자료의 요약을 거절했어요.':c==='prompt_too_large'?'자료가 너무 길어요.':c==='invalid_json'?'요약 형식이 깨졌어요. 다시 눌러 주세요.':(c==='image_rejected'||c==='images_unavailable')?'그림을 보낼 수 없었어요.':(c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')?'이 화면에서는 요약을 쓸 수 없어요.':'요약 중 연결이 끊겼어요. 다시 눌러 주세요.';}
async function summarize(){
  if(!S.sample){toast('이 화면에서는 요약을 쓸 수 없어요. Claude 앱에서 열어 주세요.',5000);return;}
  var todo=S.mats.filter(function(m){return !m.sum&&hasBody(m);}),lim=null,stop=false;
  try{lim=await S.sample.limits();}catch(e){}
  var maxImg=lim&&lim.images?lim.images.maxCount:0;
  S.sumCtl=new AbortController();
  for(var i=0;i<todo.length&&!stop;i++){
    var m=todo[i],d=MAT[m.id],imgs=d.images.slice(0,maxImg),np=Math.max(d.parts.length,1),got=[];
    m.sumErr='';
    if(!d.parts.length&&!imgs.length){m.sumErr='그림을 보낼 수 없는 화면이라 요약하지 못함';continue;}
    for(var k=0;k<np&&!stop;k++){
      S.matBusy='요약 중 '+(i+1)+'/'+todo.length+(np>1?' ('+(k+1)+'/'+np+' 부분)':'')+' · '+m.name;render();
      try{
        var opt={signal:S.sumCtl.signal},pim=k===0?imgs:[];if(pim.length)opt.images=pim.map(function(x){return x.blob;});
        got.push(cleanSum(await S.sample.json(filePrompt(m,{text:d.parts[k]||'',images:pim,np:np,pi:k+1}),opt)));
      }catch(e){m.sumErr=sampleMsg(e)+(np>1?' ('+(k+1)+'/'+np+' 부분)':'');if(STOP_CODES.indexOf(e&&e.code)>=0){stop=true;toast(sampleMsg(e),5000);}}
    }
    if(got.length&&(got.length===np||!stop)){m.sum=mergeSums(got);if(got.length<np)m.sumErr=(m.sumErr?m.sumErr+' · ':'')+np+'부분 중 '+got.length+'부분만 요약됨';}
    if(m.sum&&d.images.length>imgs.length)m.note=(m.note?m.note+', ':'')+'그림 '+d.images.length+'장 중 '+imgs.length+'장만 보냄';
    saveDraft();
  }
  if(!stop&&S.mats.some(function(m){return m.sum;})){
    S.matBusy='보고서 만드는 중';render();
    try{S.report=cleanReport(await S.sample.json(reportPrompt(),{signal:S.sumCtl.signal,cache:false}));toast('보고서를 만들었어요.');}
    catch(e){toast(sampleMsg(e),5000);}
  }
  S.sumCtl=null;S.matBusy='';saveDraft();render();
}

  if(t.id==='e-cancel'){S.edit=null;$('#layer').innerHTML='';return;}
  if(t.id==='e-del'){S.items.splice(S.edit.i,1);S.edit=null;$('#layer').innerHTML='';saveDraft();render();return;}
  if(t.dataset.sohal!=null){S.info.sohal=t.dataset.sohal;saveDraft();render();return;}

  if(t.id==='lockapp'){ask('이 폰에서 암호를 지울까요? 다시 열 때 암호를 넣어야 해요.','지우기').then(function(ok){if(ok){window.__lock();S.status='locked';S.data=null;render();}});return;}
  if(t.id==='mkpdf'){makePdf();return;}

  if(t.id==='sumstop'){if(S.sumCtl)S.sumCtl.abort();return;}

  if(t.id==='copyaddr'){var cu=siteNow();if(cu&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(cu.a).then(function(){toast('주소를 복사했어요.');}).catch(function(){toast('복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.');});else toast('복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.');return;}
  if(t.dataset.cand!=null){var cc=candAddrs()[parseInt(t.dataset.cand,10)];if(cc){S.site={addr:cc.a,src:cc.src};saveDraft();render();}return;}
  if(t.dataset.mdel){S.mats=S.mats.filter(function(m){return m.id!==t.dataset.mdel;});delete MAT[t.dataset.mdel];saveDraft();render();return;}
  if(t.id==='saverec'){dupOk().then(function(ok){if(ok)saveRec(false);});return;}
  if(t.id==='reset'){ask('작성 중인 품목과 자료 요약을 비울까요? 기록에 저장한 견적은 그대로 남아요.','비우기').then(function(ok){if(ok){S.items=[];S.meta=null;S.fileName='';S.recId='';S.info=blankInfo();S.mats=[];S.report=null;S.site={addr:'',src:''};MAT={};saveDraft();render();}});return;}
  if(t.dataset.open){var r=S.recs.filter(function(x){return x.id===t.dataset.open;})[0];if(r){S.items=JSON.parse(JSON.stringify(r.items||[]));S.meta=r.meta||null;S.fileName=r.fileName||'';S.recId=r.id;S.info=Object.assign(blankInfo(),r.info||{},{no:r.no,noTouched:true});S.mats=JSON.parse(JSON.stringify(r.mats||[]));S.report=r.report?JSON.parse(JSON.stringify(r.report)):null;S.site=Object.assign({addr:'',src:''},r.site||{});MAT={};S.tab='write';saveDraft();render();toast(r.no+'를 불러왔어요.');}return;}
  if(t.dataset.del){var id=t.dataset.del,rr=S.recs.filter(function(x){return x.id===id;})[0];ask((rr?rr.no:'이 기록')+'을 지울까요? 되돌릴 수 없어요.','지우기').then(function(ok){if(ok&&S.db)S.db.doc('quotes/'+id).delete().then(function(){if(S.recId===id)S.recId='';toast('지웠어요.');}).catch(function(){toast('지우지 못했어요.');});});return;}
});
document.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('label[for="file"],label[for="mfile"]')){ev.preventDefault();$('#'+ev.target.getAttribute('for')).click();}});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='file'){var f=t.files&&t.files[0];t.value='';onFile(f);return;}
  if(t.id==='mfile'){var fs=Array.prototype.slice.call(t.files||[]);t.value='';onMats(fs);return;}
  if(t.id==='f-addr'){render();return;}
  if(t.dataset.k==='n1'||t.dataset.k==='n2'){S.info[t.dataset.k]=t.checked;saveDraft();return;}
  if(t.dataset.e==='cls'){var E=S.edit.it;E.cls=t.value;if(!t.value)E.rk='';else if(!E.rk&&!S.edit.manual){E.rk=QE.priceLine({g:E.g,spec:E.spec,unit:E.unit,q:1},S.T).rk;}drawEdit();return;}
  if(t.dataset.e==='rk'){S.edit.it.rk=t.value;$('#e-prev').innerHTML=previewHtml();return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='f-addr'){S.site={addr:t.value.trim(),src:t.value.trim()?'직접 넣음':''};saveDraft();return;}
  if(t.id==='f-by'){AUTHOR=t.value.trim();try{localStorage.setItem('quote-author',AUTHOR);}catch(e){}return;}
  if(t.dataset.k&&t.type!=='checkbox'){S.info[t.dataset.k]=t.value;if(t.dataset.k==='no')S.info.noTouched=!!t.value.trim();saveDraft();return;}
  if(t.dataset.e&&t.tagName==='INPUT'){S.edit.it[t.dataset.e]=t.value;$('#e-prev').innerHTML=previewHtml();}
});

/* ---------- 시작 ---------- */
async function boot(){
  loadDraft();
  var tries=0;while(!(window.claude&&window.claude.use)&&tries++<30)await new Promise(function(r){setTimeout(r,100);});
  var use=function(n){return window.claude&&window.claude.use?window.claude.use(n).catch(function(){return null;}):Promise.resolve(null);};
  try{
    if(window.__loadData)S.data=await withTimeout(window.__loadData(),20000);
    else{var res=await withTimeout(fetch('data.json',{cache:'no-cache'}),15000);if(!res.ok)throw new Error('data');S.data=await res.json();}
    S.T=QE.prep(S.data);S.state.pcLast=S.data.pcLast||0;S.status='ready';
  }catch(e){if(e&&e.code==='locked'){S.status='locked';if(e.bad)S.lockMsg='저장된 암호가 맞지 않아요. 다시 넣어 주세요.';render();return;}S.status='error';render();return;}
  render();
  use('db').then(function(db){
    S.db=db;if(!db){if(S.tab==='recs')render();return;}
    db.collection('quotes').orderBy('savedAt','desc').limit(300).onSnapshot(function(q){
      S.recs=q.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      if(!S.edit&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render();
    },function(){});
  });
  use('downloads').then(function(d){S.dl=d;});
  use('sample').then(function(sm){S.sample=sm;if(S.tab==='mats'&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render();});
}
boot();
})();
</script>
